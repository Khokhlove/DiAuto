name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore DiAvto.slnx

      - name: Build
        run: dotnet build DiAvto.slnx -c Release --no-restore

      - name: Test
        run: dotnet test src/Tests/DiAvto.Tests/DiAvto.Tests.csproj -c Release --no-build --logger "trx;LogFileName=test-results.trx"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: src/Tests/DiAvto.Tests/TestResults/test-results.trx
